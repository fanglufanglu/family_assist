plugins {
    id "com.android.application"
}

android {
    namespace "com.qinqing.bangbang"
    compileSdk 35

    defaultConfig {
        applicationId "com.qinqing.bangbang"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation "io.github.webrtc-sdk:android:144.7559.09"
}
