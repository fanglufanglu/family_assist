plugins {
    id "com.android.application"
}

android {
    namespace "com.qinqing.bangbang"
    compileSdk 35

    defaultConfig {
        applicationId "com.qinqing.bangbang"
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName "0.2.4"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation "io.github.webrtc-sdk:android:144.7559.09"
}
